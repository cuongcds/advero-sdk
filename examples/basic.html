<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>advero-sdk — basic example (single ad slot)</title>
</head>
<body>
  <h1>My Website</h1>
  <p>Some content above the ad.</p>

  <div id="ad-slot-1"></div>

  <p>Some content below the ad.</p>

  <div id="ad-slot-2"></div>

  <script src="https://cdn.jsdelivr.net/gh/cuongcds/advero-sdk@0.1.2/dist/sdk.min.js"></script>
  <script>
    // baseUrl and placementCode are never defaulted by the SDK — replace
    // both with the real values for your account (see the "Getting your
    // baseUrl/placementCode" section in ../README.md).
    AdveroSDK.init({
      baseUrl: 'https://advero.shplinks.io', // your Advero ad-serving endpoint — required, no default
    });

    AdveroSDK.render({
      el: '#ad-slot-1',
      placementCode: 'ap-dfcdc4fa7ec6f82824ae-6ac8afb8', // required, no default
    });

    AdveroSDK.render({
      el: '#ad-slot-2',
      placementCode: 'ap-dfcdc4fa7ec6f82824ae-89fbfed7', // required, no default
      showPlaceholder: true
    });
  </script>
</body>
</html>
